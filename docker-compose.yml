# ProBiz ERP: local / self-hosted stack
# 1. cp .env.example .env   2. fill in the values   3. docker compose up -d --build
# App: http://localhost   API: http://localhost:8000   API docs: http://localhost:8000/docs (DEBUG=true)

services:

  # PostgreSQL database
  db:
    image: postgres:16-alpine
    container_name: probiz_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-probiz_db}
      POSTGRES_USER: ${POSTGRES_USER:-probiz_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI backend
  backend:
    build: ./backend
    container_name: probiz_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-probiz_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-probiz_db}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@probiz.pk}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      REFRESH_TOKEN_EXPIRE_DAYS: 30
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:80}
      DEBUG: ${DEBUG:-false}
    ports:
      - "8000:8000"

  # React frontend (static build served on port 3000 inside the container)
  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000}
    container_name: probiz_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:3000"

volumes:
  postgres_data:
