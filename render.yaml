services:
  - type: web
    name: probiz-erp-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c 'python seed.py && uvicorn main:app --host 0.0.0.0 --port $PORT'
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "https://probiz-erp.raees-malik89.workers.dev,http://localhost:3000"
      # TEMPORARY testing login. CHANGE these before using real data —
      # edit the values here (or in the Render dashboard) and redeploy.
      - key: SEED_ADMIN_PASSWORD
        value: "admin123"
      - key: SEED_DEMO_PASSWORD
        value: "demo123"
      - key: DATABASE_URL
        fromDatabase:
          name: probiz-db
          property: connectionString

databases:
  - name: probiz-db
    databaseName: probiz_erp
    plan: free
